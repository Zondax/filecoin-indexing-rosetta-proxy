version: "2"

linters:
  enable:
    - bodyclose
    - durationcheck
    - goconst
    - gocritic
    - gosec
    - makezero
    - reassign
    - unconvert
    - unparam
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - tests/mocks
      - extern
      - pkg/mod
      - ".*_test\\.go$"
      - tools/trace_retriever.go
      - services/construction.go
      - main.go

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - tests/mocks
      - extern
      - pkg/mod
